<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Christmas Tree</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: sans-serif;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #eee;
            text-align: center;
            padding: 20px;
        }

        #ui-layer h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s ease, opacity 0.6s ease;
        }

        #ui-layer p {
            font-size: 1.2em;
            max-width: 600px;
            margin-bottom: 30px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2em;
            transition: opacity 0.8s ease;
            z-index: 1000;
        }

        .start-btn {
            padding: 15px 30px;
            font-size: 1.5em;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0px 3px 6px rgba(0, 0, 0, 0.3);
            transition: background-color 0.3s ease, transform 0.2s ease, opacity 0.5s ease;
            opacity: 1;
        }

        .start-btn:hover {
            background-color: #367c39;
        }

        .start-btn:active {
            transform: scale(0.95);
        }

        .start-btn.hidden {
            opacity: 0;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 0;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://threejs.org/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.7/dat.gui.min.js"></script>
</head>

<body>
    <div id="overlay"></div>
    <div id="ui-layer">
        <h1>Merry Christmas!</h1>
        <button id="start-btn" class="start-btn">Happy Christmas</button>
    </div>
    <div id="loader">Loading...</div>
    <script>
        const jingle = new Audio('merry.mp3');
        let scene, camera, renderer, controls, mainGroup, particleSystem = [],
            gui;
        let mouse = new THREE.Vector2(),
            raycaster = new THREE.Raycaster();
        let treeData = [];
        let baseParticleColor = new THREE.Color(0.1, 0.7, 1.0);
        let baseDustColor = new THREE.Color(0.4, 0.2, 0.1);
        let started = false;
        let opening = { active: false, t: 0 };

        const STATE = {
            rotation: { x: 0, y: 0 },
            dampFactor: 0.25,
            mode: 'SCATTER',
            focusTarget: null,
        };

        const CONFIG = {
            numParticles: 800,
            particleSize: 0.12,
            dustAmount: 120,
            dustSize: 0.2,
            treeHeight: 8,
            treeBaseRadius: 1.5,
            levels: 6,
            sphereRadius: 4,
            rotationSpeed: 0.3,
            enableLights: true,
            lineWidth: 2,
            lineOpacity: 0.4,
            baseColor: '#1a91eb',
            dustColor: '#66330b',
            bloomThreshold: 0.0,
            bloomStrength: 0.5,
            bloomRadius: 0.5,
        };

        const EffectComposer = THREE.EffectComposer.EffectComposer;
        const RenderPass = THREE.EffectComposer.RenderPass;
        const ShaderPass = THREE.EffectComposer.ShaderPass;
        const UnrealBloomPass = THREE.UnrealBloomPass.UnrealBloomPass;

        class Particle {
            constructor(isDust = false) {
                this.isDust = isDust;
                this.baseScale = isDust ? CONFIG.dustSize : CONFIG.particleSize;
                this.color = isDust ? new THREE.Color(CONFIG.dustColor) : new THREE.Color(CONFIG.baseColor);
                this.geometry = new THREE.IcosahedronGeometry(this.baseScale, 1);
                this.material = new THREE.MeshPhongMaterial({ color: this.color, flatShading: true });
                this.mesh = new THREE.Mesh(this.geometry, this.material);
                this.mesh.castShadow = true;
                this.mesh.receiveShadow = false;
                this.originalColor = this.color.clone();

                this.posScatter = new THREE.Vector3();
                this.posTree = new THREE.Vector3();

                this.reset();
            }

            reset() {
                let theta = 2 * Math.PI * Math.random();
                let phi = Math.acos(2 * Math.random() - 1);
                let radius = CONFIG.sphereRadius * (0.5 + Math.random() * 0.5);

                this.posScatter.x = radius * Math.sin(phi) * Math.cos(theta);
                this.posScatter.y = radius * Math.sin(phi) * Math.sin(theta);
                this.posScatter.z = radius * Math.cos(phi);

                this.mesh.position.copy(this.posScatter);
                this.mesh.rotation.set(Math.random() * 10, Math.random() * 10, Math.random() * 10);
                this.mesh.scale.set(1, 1, 1);
            }

            explodeScatter(mult = 2.2) {
                this.posScatter.multiplyScalar(mult);
            }

            openingConverge(dt) {
                this.mesh.position.lerp(this.posTree, 6.5 * dt);
                this.mesh.rotation.x = THREE.MathUtils.lerp(this.mesh.rotation.x, 0, 6.0 * dt);
                this.mesh.rotation.z = THREE.MathUtils.lerp(this.mesh.rotation.z, 0, 6.0 * dt);
                this.mesh.rotation.y += 1.2 * dt;
                const s = this.baseScale;
                this.mesh.scale.lerp(new THREE.Vector3(s, s, s), 6.0 * dt);
            }

            update(dt, mode, focusTarget) {
                let targetPos = this.posScatter.clone();

                if (mode === 'TREE') {
                    targetPos = this.posTree;
                } else if (mode === 'FOCUS' && focusTarget) {
                    targetPos = focusTarget.position;
                    this.material.color.lerp(new THREE.Color(0xffffff), 0.02);
                } else {
                    this.material.color.lerp(this.originalColor, 0.02);
                }

                this.mesh.position.lerp(targetPos, 0.04);
                this.mesh.rotation.y += 0.015;
                this.mesh.rotation.z += 0.01;

                let scale = this.baseScale * (1 + Math.sin(performance.now() / 2000) * 0.2);
                this.mesh.scale.lerp(new THREE.Vector3(scale, scale, scale), 0.05);
            }
        }

        let composer, bloomPass;

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 2, 10);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 2.8;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = STATE.dampFactor;
            controls.screenSpacePanning = false;
            controls.minDistance = 5;
            controls.maxDistance = 30;
            controls.maxPolarAngle = Math.PI / 2;

            mainGroup = new THREE.Group();
            scene.add(mainGroup);

            const ambientLight = new THREE.AmbientLight(0x404040, 0.8);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(3, 7, 5);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 1024;
            directionalLight.shadow.mapSize.height = 1024;
            directionalLight.shadow.camera.near = 0.1;
            directionalLight.shadow.camera.far = 20;
            directionalLight.shadow.camera.top = 8;
            directionalLight.shadow.camera.bottom = -8;
            directionalLight.shadow.camera.left = -8;
            directionalLight.shadow.camera.right = 8;
            scene.add(directionalLight);

            const sphereGeometry = new THREE.SphereGeometry(0.3, 24, 24);
            const sphereMaterial = new THREE.MeshBasicMaterial({ color: 0xffffee });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(0, 6, 0);
            scene.add(sphere);

            const pointLight = new THREE.PointLight(0xffffee, 0.7, 0);
            pointLight.position.set(0, 6, 0);
            sphere.add(pointLight);

            const starGeometry = new THREE.OctahedronGeometry(0.8);
            const starMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffee,
                emissive: 0xffffee,
                emissiveIntensity: 0.8,
            });
            const star = new THREE.Mesh(starGeometry, starMaterial);
            star.position.set(0, CONFIG.treeHeight + 1, 0);
            star.castShadow = true;
            star.receiveShadow = false;
            mainGroup.add(star);

            for (let i = 0; i < CONFIG.numParticles; i++) {
                const particle = new Particle();
                particleSystem.push(particle);
                mainGroup.add(particle.mesh);
            }

            for (let i = 0; i < CONFIG.dustAmount; i++) {
                const particle = new Particle(true);
                particleSystem.push(particle);
                mainGroup.add(particle.mesh);
            }

            for (let i = 0; i < CONFIG.levels; i++) {
                const levelRadius = CONFIG.treeBaseRadius * (1 - i / CONFIG.levels);
                const levelHeight = CONFIG.treeHeight * (i / CONFIG.levels);
                treeData.push({ radius: levelRadius, height: levelHeight });
            }

            positionParticlesToTree();

            composer = new EffectComposer(renderer);

            const renderPass = new RenderPass(scene, camera);
            composer.addPass(renderPass);

            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;

            composer.addPass(bloomPass);

            gui = new dat.GUI();
            gui.add(CONFIG, 'particleSize', 0.05, 0.5).onChange(updateParticleSize);
            gui.add(CONFIG, 'dustSize', 0.1, 0.8).onChange(updateDustSize);
            gui.add(CONFIG, 'sphereRadius', 2, 8).onChange(updateParticlePositions);
            gui.add(CONFIG, 'rotationSpeed', 0.1, 1).name('Global Speed');
            gui.addColor(CONFIG, 'baseColor').onChange(updateBaseColor);
            gui.addColor(CONFIG, 'dustColor').onChange(updateDustColor);
            gui.add(CONFIG, 'enableLights').name('Enable Lights').onChange(updateLights);
            gui.add(CONFIG, 'lineWidth', 1, 10).name('Line Width').onChange(updateLineWidth);
            gui.add(CONFIG, 'lineOpacity', 0, 1).name('Line Opacity').onChange(updateLineOpacity);
            gui.add(CONFIG, 'bloomThreshold', 0.0, 1.0).onChange(updateBloomSettings);
            gui.add(CONFIG, 'bloomStrength', 0.0, 3.0).onChange(updateBloomSettings);
            gui.add(CONFIG, 'bloomRadius', 0.0, 1.0).onChange(updateBloomSettings);

            gui.close();

            setupEvents();
        }

        function updateBloomSettings() {
            bloomPass.threshold = CONFIG.bloomThreshold;
            bloomPass.strength = CONFIG.bloomStrength;
            bloomPass.radius = CONFIG.bloomRadius;
        }

        function updateLights() {
            scene.traverse(function (node) {
                if (node instanceof THREE.Light) {
                    node.visible = CONFIG.enableLights;
                }
            });
        }

        function updateLineWidth() {
            scene.traverse(function (node) {
                if (node instanceof THREE.Line && node.material) {
                    node.material.linewidth = CONFIG.lineWidth;
                }
            });
        }

        function updateLineOpacity() {
            scene.traverse(function (node) {
                if (node instanceof THREE.Line && node.material) {
                    node.material.opacity = CONFIG.lineOpacity;
                    node.material.transparent = CONFIG.lineOpacity < 1;
                }
            });
        }

        function updateBaseColor() {
            const newColor = new THREE.Color(CONFIG.baseColor);
            particleSystem.forEach(p => {
                if (!p.isDust) {
                    p.color.copy(newColor);
                    p.originalColor.copy(newColor);
                    p.material.color.copy(newColor);
                }
            });
        }

        function updateDustColor() {
            const newColor = new THREE.Color(CONFIG.dustColor);
            particleSystem.forEach(p => {
                if (p.isDust) {
                    p.color.copy(newColor);
                    p.originalColor.copy(newColor);
                    p.material.color.copy(newColor);
                }
            });
        }

        function updateParticleSize() {
            particleSystem.forEach(p => {
                if (!p.isDust) {
                    p.baseScale = CONFIG.particleSize;
                    p.geometry = new THREE.IcosahedronGeometry(p.baseScale, 1);
                    p.mesh.geometry.dispose();
                    p.mesh.geometry = new THREE.IcosahedronGeometry(p.baseScale, 1);
                }
            });
        }

        function updateDustSize() {
            particleSystem.forEach(p => {
                if (p.isDust) {
                    p.baseScale = CONFIG.dustSize;
                    p.geometry = new THREE.IcosahedronGeometry(p.baseScale, 1);
                    p.mesh.geometry.dispose();
                    p.mesh.geometry = new THREE.IcosahedronGeometry(p.baseScale, 1);
                }
            });
        }

        function updateParticlePositions() {
            particleSystem.forEach(p => p.reset());
        }

        function positionParticlesToTree() {
            particleSystem.forEach(particle => {
                let level = Math.floor(Math.random() * treeData.length);
                let levelData = treeData[level];

                let angle = Math.random() * Math.PI * 2;
                let radius = Math.random() * levelData.radius;

                particle.posTree.x = radius * Math.cos(angle);
                particle.posTree.y = levelData.height + (Math.random() * 2 - 1) * 0.4;
                particle.posTree.z = radius * Math.sin(angle);
            });
        }

        function setupEvents() {
            window.addEventListener('resize', onWindowResize, false);
            document.addEventListener('mousemove', onMouseMove, false);
            document.addEventListener('touchstart', onTouchStart, false);
            document.addEventListener('touchmove', onTouchMove, false);

            const startBtn = document.getElementById('start-btn');
            if (startBtn) {
                startBtn.addEventListener('click', () => {
                    if (started) return;
                    started = true;

                    particleSystem.forEach(p => p.explodeScatter?.(p.isDust ? 2.8 : 2.2));
                    STATE.mode = 'SCATTER';
                    STATE.focusTarget = null;

                    jingle.play();

                    const title = document.querySelector('#ui-layer h1');
                    if (title) {
                        title.style.transition = 'transform .6s ease, opacity .6s ease';
                        title.style.transform = 'scale(1.08)';
                        setTimeout(() => { title.style.transform = 'scale(1)'; }, 700);
                    }

                    startBtn.classList.add('hidden');
                    const loader = document.getElementById('loader');
                    if (loader) { loader.style.opacity = 0; setTimeout(() => loader.remove(), 800); }

                    opening.active = true;
                    opening.t = 0;

                    setTimeout(() => { STATE.mode = 'TREE'; }, 600);
                });
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
            updateRaycaster();
        }

        function onTouchStart(event) {
            event.preventDefault();
            let touch = event.touches[0];
            mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (touch.clientY / window.innerHeight) * 2 + 1;
            updateRaycaster();
        }

        function onTouchMove(event) {
            event.preventDefault();
            let touch = event.touches[0];
            mouse.x = (touch.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (touch.clientY / window.innerHeight) * 2 + 1;
            updateRaycaster();
        }

        function updateRaycaster() {
            raycaster.setFromCamera(mouse, camera);
            let intersects = raycaster.intersectObjects(particleSystem.map(p => p.mesh));

            if (intersects.length > 0) {
                STATE.mode = 'FOCUS';
                STATE.focusTarget = intersects[0].object;
            } else {
                STATE.mode = 'TREE';
                STATE.focusTarget = null;
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            if (opening.active) {
                opening.t += dt;

                if (opening.t < 0.6) {
                    STATE.rotation.y += 1.6 * dt;
                } else {

                }

                if (opening.t > 0.6 && opening.t < 1.2) {
                    const star = mainGroup.children.find(m => m.geometry && m.geometry.type === 'OctahedronGeometry');
                    if (star && star.material && star.material.emissiveIntensity !== undefined) {
                        const pulse = 1.0 + Math.sin((opening.t - 0.6) * Math.PI * 2) * 0.6;
                        star.material.emissiveIntensity = 0.8 + pulse * 0.6;
                    }
                }

                if (opening.t > 2.2) {
                    opening.active = false;
                }
            }

            STATE.rotation.x += (0 - STATE.rotation.x) * STATE.dampFactor;
            STATE.rotation.y += (CONFIG.rotationSpeed / 40 - STATE.rotation.y) * STATE.dampFactor;

            if (opening.active && opening.t >= 0.6) {
                STATE.rotation.y += (0.3 - (STATE.rotation.y - mainGroup.rotation.y)) * 0.2 * dt;
                STATE.rotation.x += (0 - STATE.rotation.x) * 2.5 * dt;
            }

            mainGroup.rotation.x = STATE.rotation.x;
            mainGroup.rotation.y = STATE.rotation.y;

            particleSystem.forEach(p => {
                if (opening.active && opening.t >= 0.6 && STATE.mode === 'TREE' && !p.isDust) {
                    p.openingConverge(dt);
                } else {
                    p.update(dt, STATE.mode, STATE.focusTarget);
                }
            });

            controls.update();
            composer.render();
        }

        const clock = new THREE.Clock();

        init();
        animate();
    </script>

    <script src="https://unpkg.com/three@0.126.1/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://unpkg.com/three@0.126.1/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://unpkg.com/three@0.126.1/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://unpkg.com/three@0.126.1/examples/js/postprocessing/UnrealBloomPass.js"></script>
</body>

</html>
